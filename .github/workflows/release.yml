name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: npm run dist:linux
            installers: release/Holo-*.deb
            metadata: release/latest-linux.yml
          - os: windows-latest
            platform: windows
            command: npm run dist:win
            installers: |
              release/Holo-*.exe
              release/Holo-*.exe.blockmap
            metadata: release/latest.yml
          - os: macos-latest
            platform: macos
            command: npm run dist:mac
            installers: |
              release/Holo-*.dmg
              release/Holo-*.zip
            metadata: release/latest-mac.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distributables
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Les installeurs d'abord, le fichier de mise à jour (latest*.yml) ensuite :
      # si un envoi échoue, aucun poste ne se voit proposer une version introuvable.
      - name: Publish installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.installers }}
          fail_on_unmatched_files: true

      - name: Publish update metadata
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.metadata }}
          fail_on_unmatched_files: true
